<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand__mascot" aria-hidden="true"></span>
      <span class="login-brand__name">MoneyMonkey</span>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <h1 class="login-form__title">Entrar</h1>

      <div class="field">
        <label for="username">Usuário</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <span class="field-error">Usuário é obrigatório</span>
        }
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="field-error">Senha é obrigatória</span>
        }
      </div>

      @if (errorMessage) {
        <p class="form-error" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" class="login-form__submit">Entrar</button>
    </form>
  </div>
</div>
